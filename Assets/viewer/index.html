<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live2D Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        background-color: transparent !important;
        user-select: none;
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: transparent !important;
        background-color: transparent !important;
      }
    </style>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.8/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script>
      let app, currentModel;
      let targetAngleX = 0,
        targetAngleY = 0;
      let currAngleX = 0,
        currAngleY = 0;

      async function initAvatar() {
        const canvas = document.getElementById("canvas");

        app = new PIXI.Application({
          view: canvas,
          backgroundAlpha: 0,
          transparent: true,
          clearBeforeRender: true,
          autoDensity: true,
          resolution: window.devicePixelRatio || 1,
          resizeTo: window,
        });

        try {
          currentModel = await PIXI.live2d.Live2DModel.from(
            "/Assets/model/tuzi_mian.model3.json",
          );
          app.stage.addChild(currentModel);

          currentModel.anchor.set(0.5, 0.5);
          currentModel.position.set(
            window.innerWidth / 2,
            window.innerHeight / 2,
          );

          const scale =
            Math.min(
              window.innerWidth / currentModel.width,
              window.innerHeight / currentModel.height,
            ) * 0.85;
          currentModel.scale.set(scale);

          // Loop pernapasan & menoleh alami
          app.ticker.add(() => {
            if (!currentModel || !currentModel.internalModel) return;

            currAngleX += (targetAngleX - currAngleX) * 0.05;
            currAngleY += (targetAngleY - currAngleY) * 0.05;

            const coreModel = currentModel.internalModel.coreModel;
            if (coreModel && coreModel.setParameterValueById) {
              coreModel.setParameterValueById("ParamAngleX", currAngleX);
              coreModel.setParameterValueById("ParamAngleY", currAngleY);
              coreModel.setParameterValueById(
                "ParamBodyAngleX",
                currAngleX * 0.5,
              );
            }
          });

          setInterval(() => {
            targetAngleX = (Math.random() - 0.5) * 40;
            targetAngleY = (Math.random() - 0.5) * 20;
          }, 4000);
        } catch (err) {
          console.error("[ERROR] Gagal memuat model:", err);
        }
      }

      window.setMouthOpen = function (val) {
        if (
          currentModel &&
          currentModel.internalModel &&
          currentModel.internalModel.coreModel
        ) {
          currentModel.internalModel.coreModel.setParameterValueById(
            "ParamMouthOpenY",
            val,
          );
        }
      };

      window.onload = initAvatar;
    </script>
  </body>
</html>
